<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR Table logo</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
* { margin: 0; box-sizing: border-box; }
html, body { width: 480px; height: 480px; background: transparent; }
.tile { width: 480px; height: 480px; border-radius: 96px; background: radial-gradient(circle at 50% 40%, #16220a, #05070a 70%); display: grid; place-items: center; overflow: hidden; position: relative; }
.pr { font-family: "Bungee", sans-serif; font-size: 230px; line-height: 1; color: #c8ff5a; transform: skew(-9deg) translateY(-24px); letter-spacing: .02em;
  text-shadow: 3px 3px 0 #8fcc2f, 6px 6px 0 #79ad25, 9px 9px 0 #638f1c, 12px 12px 0 #4d7114, 15px 15px 0 #426210, 20px 26px 40px #000c, 0 0 90px #a3e63580; }
.table { position: absolute; bottom: 70px; font-family: "Bungee", sans-serif; font-size: 66px; color: #7fbf2a; transform: skew(-9deg); letter-spacing: .14em;
  text-shadow: 2px 2px 0 #527f1b, 4px 4px 0 #456b16; }
</style>
</head>
<body><div class="tile"><div class="pr">PR</div><div class="table">TABLE</div></div></body>
</html>
